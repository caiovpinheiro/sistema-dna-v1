# Deploy INDEPENDENTE e ordenado do monólito e do gateway MCP (Opção A). Não substitui o deploy.yml:
#  - o deploy.yml continua construindo e implantando o monólito a cada push na main (inalterado);
#  - este workflow cuida do gateway MCP e permite um deploy coordenado e aprovado, em ordem segura.
#
# UM DONO POR COMPONENTE (sem deploy duplicado):
#  - MCP: este workflow.
#  - Monólito: o `deploy.yml` (padrão, variável MONOLITO_DEPLOY_DONO ausente ou "deploy.yml"). Neste caso este workflow NÃO dispara
#    o webhook do monólito: apenas ESPERA o deploy.yml do mesmo commit terminar e o monólito ficar saudável, e só então implanta o MCP.
#  - Só quando houver autorização para desligar o gatilho do deploy.yml, defina MONOLITO_DEPLOY_DONO=deploy-independente: aí este
#    workflow passa a ser o único a implantar o monólito (e o deploy.yml deve ser desativado NO MESMO MOMENTO).
#
# Segurança:
#  - NENHUM push em branch de desenvolvimento implanta: os jobs de deploy exigem refs/heads/main;
#  - push na main só implanta o MCP se a variável do repositório MCP_DEPLOY_AUTOMATICO for "true" (padrão: desligado);
#  - todo deploy passa por Environment com aprovação ("producao-monolito", "producao-mcp") e por uma única fila (concurrency);
#  - URLs e tokens dos webhooks ficam só em secrets.
name: Deploy independente (MCP e monólito)

on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - ".github/workflows/deploy-independente.yml"
  workflow_dispatch:
    inputs:
      alvo:
        description: "O que implantar"
        type: choice
        default: auto
        options: [auto, monolito, mcp, ambos]
      rollback_mcp_para_sha:
        description: "Rollback do gateway: SHA (completo) de uma imagem já publicada. Vazio = deploy normal."
        type: string
        default: ""
      simular:
        description: "Só valida (testes, build e plano); não implanta"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: read

# Uma fila só para toda a produção: nunca dois deploys ao mesmo tempo (nem de componentes diferentes).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  IMAGEM_MCP: ghcr.io/${{ github.repository }}-mcp

jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      deploy_monolito: ${{ steps.p.outputs.deploy_monolito }}
      esperar_monolito: ${{ steps.p.outputs.esperar_monolito }}
      deploy_mcp: ${{ steps.p.outputs.deploy_mcp }}
      rollback: ${{ steps.p.outputs.rollback }}
      motivo: ${{ steps.p.outputs.motivo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        name: Detectar mudanças desde o último deploy de CADA componente
        run: |
          set -euo pipefail
          git fetch --tags --force >/dev/null 2>&1 || true
          zero="0000000000000000000000000000000000000000"
          base_de() {
            # Tag móvel do último commit implantado do componente (criada após cada deploy com sucesso). Sem tag = tudo mudou.
            local b; b="$(git rev-parse -q --verify "refs/tags/$1^{commit}" 2>/dev/null || true)"
            if [ -z "$b" ] || ! git cat-file -e "$b^{commit}" 2>/dev/null; then b="$zero"; fi
            echo "$b"
          }
          # No push na main o ponto de comparação é o commit anterior; no manual, a tag de cada componente.
          if [ "${{ github.event_name }}" = "push" ]; then bm="${{ github.event.before }}"; bc="$bm"; else bm="$(base_de deploy-prod-monolito)"; bc="$(base_de deploy-prod-mcp)"; fi
          GITHUB_OUTPUT=/dev/null node scripts/detectar-mudancas.mjs --base "$bm" --head "$GITHUB_SHA" > /tmp/monolito.json
          GITHUB_OUTPUT=/dev/null node scripts/detectar-mudancas.mjs --base "$bc" --head "$GITHUB_SHA" > /tmp/mcp.json
          echo "deploy_monolito=$(jq -r .deploy_monolito /tmp/monolito.json)" >> "$GITHUB_OUTPUT"
          echo "deploy_mcp=$(jq -r .deploy_mcp /tmp/mcp.json)" >> "$GITHUB_OUTPUT"
      - id: p
        name: Plano de deploy
        env:
          ALVO: ${{ inputs.alvo || 'auto' }}
          ROLLBACK: ${{ inputs.rollback_mcp_para_sha || '' }}
          AUTOMATICO: ${{ vars.MCP_DEPLOY_AUTOMATICO || 'false' }}
          DONO: ${{ vars.MONOLITO_DEPLOY_DONO || 'deploy.yml' }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          dm="${{ steps.d.outputs.deploy_monolito }}"; dc="${{ steps.d.outputs.deploy_mcp }}"
          case "$ALVO" in
            monolito) dm=true; dc=false;;
            mcp) dm=false; dc=true;;
            ambos) dm=true; dc=true;;
          esac
          motivo="manual ($ALVO)"
          if [ "$EVENTO" = "push" ]; then
            # Na main, o monólito é implantado pelo deploy.yml existente; aqui só o MCP, e só com a chave ligada.
            dm=false; motivo="push na main"
            if [ "$AUTOMATICO" != "true" ]; then dc=false; motivo="push na main (MCP_DEPLOY_AUTOMATICO desligado)"; fi
          fi
          rb=false
          if [ -n "$ROLLBACK" ]; then
            [[ "$ROLLBACK" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA de rollback inválido"; exit 1; }
            rb=true; dm=false; dc=true; motivo="rollback do gateway para $ROLLBACK"
          fi
          # Dono do deploy do monólito: só quem é dono dispara o webhook; o outro caminho apenas espera.
          esperar=false
          if [ "$dm" = "true" ] && [ "$DONO" != "deploy-independente" ]; then esperar=true; dm_aqui=false; else dm_aqui=$dm; fi
          [ "$EVENTO" = "workflow_dispatch" ] && [ "$ALVO" = "monolito" ] && [ "$DONO" != "deploy-independente" ] && { echo "O deploy do monólito pertence ao deploy.yml (MONOLITO_DEPLOY_DONO='$DONO'). Use o workflow deploy.yml ou transfira a titularidade com autorização."; exit 1; }
          echo "deploy_monolito=$dm_aqui" >> "$GITHUB_OUTPUT"; echo "esperar_monolito=$esperar" >> "$GITHUB_OUTPUT"; echo "deploy_mcp=$dc" >> "$GITHUB_OUTPUT"
          echo "rollback=$rb" >> "$GITHUB_OUTPUT"; echo "motivo=$motivo" >> "$GITHUB_OUTPUT"
          { echo "### Plano"; echo "- motivo: $motivo"; echo "- monólito necessário: $dm (dono do deploy: $DONO; este workflow dispara: $dm_aqui; apenas espera: $esperar)"; echo "- MCP: $dc"; echo "- ordem: monólito → MCP (migrations e contrato interno sempre primeiro no monólito)"; } >> "$GITHUB_STEP_SUMMARY"

  testes:
    needs: plano
    if: needs.plano.outputs.rollback != 'true'
    uses: ./.github/workflows/mcp-ci.yml
    with:
      forcar_tudo: ${{ needs.plano.outputs.deploy_monolito == 'true' && needs.plano.outputs.deploy_mcp == 'true' }}

  imagem-mcp:
    needs: [plano, testes]
    if: >-
      always() && needs.plano.outputs.deploy_mcp == 'true' && needs.plano.outputs.rollback != 'true'
      && needs.testes.result == 'success' && github.ref == 'refs/heads/main' && inputs.simular != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: mcp-server
          push: true
          tags: |
            ${{ env.IMAGEM_MCP }}:latest
            ${{ env.IMAGEM_MCP }}:${{ github.sha }}

  deploy-monolito:
    needs: [plano, testes]
    if: >-
      always() && needs.plano.outputs.deploy_monolito == 'true' && needs.testes.result == 'success'
      && github.ref == 'refs/heads/main' && inputs.simular != true
    runs-on: ubuntu-latest
    environment: producao-monolito # exige aprovação (Required reviewers) configurada no GitHub
    steps:
      - name: Esperar a imagem do monólito (construída pelo deploy.yml existente neste mesmo commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            r="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)"
            echo "deploy.yml: ${r:-sem execução}"
            case "$r" in "completed success") exit 0;; "completed "*) echo "build do monólito falhou"; exit 1;; esac
            sleep 20
          done
          echo "tempo esgotado esperando o build do monólito"; exit 1
      - name: Disparar deploy do monólito no EasyPanel
        env:
          WEBHOOK: ${{ secrets.WEBHOOK_DEPLOY_SISTEMA_DNA }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "Segredo WEBHOOK_DEPLOY_SISTEMA_DNA ausente."; exit 1; }
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 --output /dev/null --request POST "$WEBHOOK" \
            || curl --fail --silent --show-error --connect-timeout 15 --max-time 30 --output /dev/null --request GET "$WEBHOOK"
      - name: Esperar o monólito ficar saudável (migrations aplicadas pelo entrypoint)
        env:
          URL: ${{ vars.MONOLITO_URL_SAUDE }}
        run: |
          [ -n "$URL" ] || { echo "Defina a variável MONOLITO_URL_SAUDE (ex.: https://painel.../health)."; exit 1; }
          sleep 30
          for i in $(seq 1 40); do
            if curl --fail --silent --max-time 10 "$URL" >/dev/null; then echo "monólito saudável"; exit 0; fi
            sleep 15
          done
          echo "monólito não ficou saudável a tempo"; exit 1

  aguardar-monolito:
    # Dono do deploy do monólito = deploy.yml: aqui NÃO se implanta; só se garante a ORDEM (monólito antes do MCP).
    needs: [plano, testes]
    if: >-
      always() && needs.plano.outputs.esperar_monolito == 'true' && needs.testes.result == 'success'
      && github.ref == 'refs/heads/main' && inputs.simular != true
    runs-on: ubuntu-latest
    steps:
      - name: Esperar o deploy.yml deste commit (build + webhook do monólito)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            r="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)"
            echo "deploy.yml: ${r:-sem execução}"
            case "$r" in "completed success") break;; "completed "*) echo "o deploy.yml falhou: o MCP não será implantado antes do monólito"; exit 1;; esac
            [ "$i" = 60 ] && { echo "tempo esgotado esperando o deploy.yml (rode-o manualmente neste commit)"; exit 1; }
            sleep 20
          done
      - name: Esperar o monólito ficar saudável
        env:
          URL: ${{ vars.MONOLITO_URL_SAUDE }}
        run: |
          [ -n "$URL" ] || { echo "Defina a variável MONOLITO_URL_SAUDE."; exit 1; }
          sleep 30
          for i in $(seq 1 40); do curl --fail --silent --max-time 10 "$URL" >/dev/null && { echo "monólito saudável"; exit 0; }; sleep 15; done
          echo "monólito não ficou saudável a tempo"; exit 1

  deploy-mcp:
    needs: [plano, testes, imagem-mcp, deploy-monolito, aguardar-monolito]
    # O MCP só vai depois do monólito (quando há deploy dele) e nunca se o monólito falhou.
    if: >-
      always() && needs.plano.outputs.deploy_mcp == 'true' && github.ref == 'refs/heads/main' && inputs.simular != true
      && (needs.plano.outputs.rollback == 'true' || (needs.testes.result == 'success' && needs.imagem-mcp.result == 'success'))
      && (needs.deploy-monolito.result == 'success' || needs.deploy-monolito.result == 'skipped')
      && (needs.aguardar-monolito.result == 'success' || needs.aguardar-monolito.result == 'skipped')
    runs-on: ubuntu-latest
    environment: producao-mcp # exige aprovação (Required reviewers) configurada no GitHub
    steps:
      - uses: docker/login-action@v3
        if: needs.plano.outputs.rollback == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rollback — apontar :latest para a imagem anterior
        if: needs.plano.outputs.rollback == 'true'
        env:
          SHA: ${{ inputs.rollback_mcp_para_sha }}
        run: docker buildx imagetools create --tag "${IMAGEM_MCP}:latest" "${IMAGEM_MCP}:${SHA}"
      - name: Disparar deploy do gateway MCP no EasyPanel
        env:
          WEBHOOK: ${{ secrets.WEBHOOK_DEPLOY_MCP_SERVER }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "Segredo WEBHOOK_DEPLOY_MCP_SERVER ausente."; exit 1; }
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 --output /dev/null --request POST "$WEBHOOK" \
            || curl --fail --silent --show-error --connect-timeout 15 --max-time 30 --output /dev/null --request GET "$WEBHOOK"
      - name: Esperar o gateway ficar PRONTO (certificados, contrato, issuer)
        env:
          URL: ${{ vars.MCP_URL_PRONTO }}
        run: |
          [ -n "$URL" ] || { echo "Defina a variável MCP_URL_PRONTO (ex.: https://mcp.dnawork.ai/ready)."; exit 1; }
          sleep 20
          for i in $(seq 1 40); do
            if curl --fail --silent --max-time 10 "$URL" >/dev/null; then echo "gateway pronto"; exit 0; fi
            sleep 15
          done
          echo "gateway não ficou pronto a tempo (veja os motivos em /ready)"; exit 1

  registrar:
    needs: [plano, deploy-monolito, aguardar-monolito, deploy-mcp]
    if: >-
      always() && github.ref == 'refs/heads/main' && inputs.simular != true && needs.plano.outputs.rollback != 'true'
      && (needs.deploy-monolito.result == 'success' || needs.deploy-mcp.result == 'success')
      && needs.deploy-monolito.result != 'failure' && needs.deploy-mcp.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Marcar o último commit implantado de cada componente (base da próxima detecção)
        env:
          DM: ${{ needs.deploy-monolito.result }}
          DC: ${{ needs.deploy-mcp.result }}
        run: |
          if [ "$DM" = "success" ]; then git tag -f deploy-prod-monolito "$GITHUB_SHA" && git push --force origin refs/tags/deploy-prod-monolito; fi
          if [ "$DC" = "success" ]; then git tag -f deploy-prod-mcp "$GITHUB_SHA" && git push --force origin refs/tags/deploy-prod-mcp; fi
