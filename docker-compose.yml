# PostgreSQL somente local. Não aponta para a base atual.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dnawork
    ports:
      - "54330:5432"
    volumes:
      - dnawork_pg:/var/lib/postgresql/data
      - ./database/schema/local-dev.sql:/docker-entrypoint-initdb.d/01-local-dev.sql:ro
volumes:
  dnawork_pg:
